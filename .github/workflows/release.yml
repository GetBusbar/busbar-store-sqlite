# RENDERED by `cargo xtask fleet render busbar-store-sqlite` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. On a v* tag: this
# repo's CI on the tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then
# the consumer verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@bf32f11ba9634c77afbe1dc89a8c3986499b38af
    with:
      service: none
      busbar_checkout: true
      macos_test: "cargo test --workspace --locked"
      extra_test: ""
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@bf32f11ba9634c77afbe1dc89a8c3986499b38af
    with:
      plugin_crate: busbar-store-sqlite-plugin
      manifest_name: busbar-store-sqlite
      plugin_alias: sqlite
      plugin_kind: store
      asset_prefix: busbar-store-sqlite
      description: "First-party signed kind:store plugin cdylib: the SQLite governance store packaged as a droppable busbar plugin exporting the store C ABI. Drop the built library into the plugins folder and set store.module: sqlite."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "store-sqlite/declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@bf32f11ba9634c77afbe1dc89a8c3986499b38af
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-store-sqlite
      plugin_name: busbar-store-sqlite
      plugin_alias: sqlite
      plugin_kind: store
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
