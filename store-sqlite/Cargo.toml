# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-sqlite"
version = "1.0.0"
publish = false            # a first-party plugin crate; shipped linked into busbar or as a signed tarball
edition = "2021"
rust-version = "1.97"
description = "The SQLite backend for busbar's durable governance store: implements busbar_contract::records::RecordStore on rusqlite (bundled)."
license = "Apache-2.0"

[lib]
# rlib: THE LOGIC and its one door (`store_door!`, `door::door`, the store v3 table), which exports
# no symbol. A busbar build that links this crate registers `door`; the sibling
# `busbar-store-sqlite-plugin` cdylib exports the same `door` as `busbar_plugin_door`. One source,
# both doors (DECISIONS #2 rule (1)).
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into it
# as `busbar_contract::abi::sdk`). Pinned by git rev to the busbar commit in `.busbar-ref`; a busbar
# build that links this crate `[patch]`es the busbar git source to its own tree, so ONE copy of the
# contract links.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "bf32f11ba9634c77afbe1dc89a8c3986499b38af" }
# `bundled` compiles SQLite from source so the plugin has no system libsqlite3 dependency at all.
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde_json = "1"
# `derive` for the v10 migration's legacy row encoders, the v3 dedupe log's stored answers (and the
# conformance suite's stand-in bodies).
serde = { version = "1", features = ["derive"] }

# The `RecordStore` contract conformance suite lives in this crate's own
# `src/tests/store_conformance.rs` (#2/#31 forbid a shared test util between plugins). The one
# dev-only edge is the contract's own `test-seal` feature: it compiles `busbar_contract::testkit`,
# whose `store_v3` cases are the store kind's epoch and slice-life spec every durable store runs
# (`abi::store::SLICE_TTL_MS`). Same pinned rev, so one contract links.
[dev-dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "bf32f11ba9634c77afbe1dc89a8c3986499b38af", features = ["test-seal"] }
