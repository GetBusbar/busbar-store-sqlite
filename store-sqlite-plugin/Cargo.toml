# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-sqlite-plugin"
version = "1.6.0"
publish.workspace = true   # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition.workspace = true
rust-version.workspace = true
description = "First-party signed kind:store plugin cdylib: the SQLite governance store packaged as a droppable busbar plugin exporting the store C ABI. Drop the built library into the plugins folder and set store.module: sqlite."
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: REQUIRED for `cargo test` to emit the cdylib artifact native conformance and migration tests load.
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `v4::door` is the door this image exports.
busbar-store-sqlite = { path = "../store-sqlite" }
busbar-contract = { workspace = true }

[dev-dependencies]
# The native conformance tests load the built cdylib and the linked door over the REAL loader (the
# one dispatcher, the primitive Store table) — dev-only, never in the shipped artifact. Same pinned rev as
# the logic crate's busbar-contract, so one busbar source resolves.
busbar-plugin-loader = { workspace = true , features = ["test-support"] }
serde_json = { workspace = true }
rusqlite = { workspace = true }
# Dev-only: native persistence calls are asynchronous.
tokio = { workspace = true, features = ["rt"] }
busbar-contract = { workspace = true, features = ["test-seal"] }

[package.metadata.busbar.test-artifacts]
cdylib = ["BUSBAR_TEST_SQLITE_CDYLIB", "BUSBAR_BOOTSTRAP_TEST_STORE_PLUGIN"]
