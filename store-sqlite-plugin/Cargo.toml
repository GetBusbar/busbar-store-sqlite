# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-sqlite-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:store plugin cdylib: the SQLite governance store packaged as a droppable busbar plugin exporting the store C ABI. Drop the built library into the plugins folder and set governance.store: sqlite."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`). rlib: REQUIRED for `cargo test` to
# emit the cdylib artifact the conformance and e2e tests load.
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo. Its `export_store_plugin!(open)` registers the image's one door; this crate
# only makes that door a loadable library.
busbar-store-sqlite = { path = "../store-sqlite" }

[dev-dependencies]
# The conformance and e2e tests load the built cdylib over the REAL loader (sign, pack, scan, open)
# and the linked row through the same registry — dev-only, never in the shipped artifact. Same pinned
# rev as the logic crate's busbar-contract, so one busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "8b7b6473f47f8d37ae60839c74cfe6a9b64a1dc9" }
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "8b7b6473f47f8d37ae60839c74cfe6a9b64a1dc9" }
serde_json = "1"
# Dev-only: the `busy_timeout_ms_is_actually_applied`-style checks open a second, independent
# connection to the SAME sqlite file. Same version/feature as `busbar-store-sqlite`'s dependency so
# only one sqlite is ever linked in.
rusqlite = { version = "0.40.0", features = ["bundled"] }
# Dev-only: the admin-API install e2e test drives a REAL running busbar process's admin HTTP API
# (POST /api/v1/admin/plugins, POST /api/v1/admin/keys) — the actual operator install path.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
base64 = "0.22"
