# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-sqlite"
version = "1.0.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The SQLite backend for busbar's durable governance store: implements busbar_api::Store on rusqlite (bundled)."
license = "Apache-2.0"

[dependencies]
# INTERIM: busbarAI isn't public yet, so this is a local path dependency into a sibling checkout of
# the monorepo. Once busbarAI ships publicly this should become a git (pinned rev/tag) or crates.io
# dependency instead — same pattern already applied to busbar-plugin-sdk in ../store-sqlite-plugin.
busbar-api = { path = "../../busbarAI/crates/api" }
# `bundled` compiles SQLite from source so the plugin has no system libsqlite3 dependency at all —
# same as the busbarAI in-tree crate this was extracted from.
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
# The shared `Store` contract conformance suite, so the four behaviours the fleet used to disagree
# on are asserted from ONE place rather than hand-copied into each backend, which is how they
# drifted apart to begin with.
busbar-plugin-testkit = { path = "../../busbarAI/crates/plugin-testkit", features = ["store"] }
