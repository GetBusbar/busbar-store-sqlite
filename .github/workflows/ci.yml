# store-sqlite CI — build, test, the store's linked + dropped-in conformance, and the real-binary
# install e2e, against the busbar rev this repo PINS.
#
# This repo builds standalone: its only busbar dependency (busbar-contract, and busbar-plugin-loader
# dev-only for the conformance and e2e tests) is a `git` dependency on
# https://github.com/GetBusbar/busbar at the rev in field 1 of `.busbar-ref`. No manifest names a
# sibling checkout, so what CI proves is exactly what a busbar build that pulls this repo at a pinned
# rev links.
#
# The e2e tests (store-sqlite-plugin/tests/e2e.rs) install the packed plugin into a REAL busbar
# process (file drop + `--validate`, and the live admin API), so busbar is checked out beside this
# repo AT THE SAME PINNED REV and the tests build its `busbar` and `busbar-plugin-pack` binaries.
#
# The moving leg (this repo's `dev` against busbar's `predev`) is busbar's side of the contract: its
# ci.yml builds this repo against busbar's own tree.
name: ci

on:
  push:
    branches: [main, dev, qa]
  pull_request:
    branches: [main, dev, qa]
  workflow_dispatch: {}
  # release.yml's `gate` runs THIS workflow on the tagged commit, so a release is gated by exactly the
  # suite (pin check, fmt, clippy, build, test, conformance) every dev push runs — at the same pin.
  workflow_call: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  pin:
    name: the busbar pin is one rev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every `rev = "..."` on the busbar git source in every manifest is field 1 of `.busbar-ref`.
      # Two revs would link two copies of the contract; a rev that disagrees with `.busbar-ref` makes
      # the pin a lie about what the release builds against.
      - name: every busbar git dependency names the .busbar-ref rev
        run: |
          set -euo pipefail
          pin=$(awk '{print $1; exit}' .busbar-ref)
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.busbar-ref field 1 is not a full sha: '$pin'"; exit 1; }
          found=$(grep -hoE 'git = "https://github.com/GetBusbar/busbar", rev = "[0-9a-f]+"' ./*/Cargo.toml | grep -oE '[0-9a-f]{40}' | sort -u)
          [ -n "$found" ] || { echo "::error::no busbar git dependency found"; exit 1; }
          if [ "$found" != "$pin" ]; then
            echo "::error::busbar revs in manifests ($found) != .busbar-ref ($pin)"; exit 1
          fi
          if grep -nE 'path = "\.\./\.\./' ./*/Cargo.toml; then
            echo "::error::a manifest names a sibling-checkout path dependency"; exit 1
          fi
          echo "pinned busbar rev: $pin"

  build-test:
    name: fmt, clippy, build, test, conformance, e2e [${{ matrix.os }}]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: read the busbar pin
        id: pin
        run: echo "rev=$(awk '{print $1; exit}' plugin/.busbar-ref)" >> "$GITHUB_OUTPUT"
      # The e2e tests' busbar checkout (`../../busbar` from the crate dir): the pinned rev, never a
      # branch, so the binaries the e2e boots are the ones the manifests build against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ steps.pin.outputs.rev }}
          path: busbar
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin
          key: busbar-${{ steps.pin.outputs.rev }}
      - name: fmt
        working-directory: plugin
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: plugin
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build (the rlib a busbar build links, and the cdylib a signed tarball carries)
        working-directory: plugin
        run: cargo build --workspace --locked
      - name: test (store suite + linked/dropped-in conformance + real-binary e2e)
        working-directory: plugin
        env:
          BUSBAR_CHECKOUT: ${{ github.workspace }}/busbar
          # The e2e's nested busbar build is busbar's code, not this repo's: do not hold it to this
          # repo's -D warnings.
          RUSTFLAGS: ""
        run: cargo test --workspace --locked

  # ── coverage (llvm-cov · codecov) ─────────────────────────────────────────────────────────────
  # ADDITIVE, NON-GATING coverage reporting for the README badge + per-PR line context. Not a
  # required check: fail_ci_if_error: false, and codecov.yml marks every status informational. The
  # correctness gate is `build-test` above. Same busbar checkout at the pin (the e2e tests build its
  # `busbar` and `busbar-plugin-pack` binaries).
  coverage:
    name: coverage (llvm-cov · codecov)
    needs: [pin]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: read the busbar pin
        id: pin
        run: echo "rev=$(awk '{print $1; exit}' plugin/.busbar-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ steps.pin.outputs.rev }}
          path: busbar
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugin
            busbar
          key: coverage-${{ steps.pin.outputs.rev }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage (workspace, e2e wired)
        working-directory: plugin
        env:
          BUSBAR_CHECKOUT: ${{ github.workspace }}/busbar
          RUSTFLAGS: ""
        run: cargo llvm-cov --workspace --locked --ignore-run-fail --lcov --output-path lcov.info
      - name: Upload to Codecov (never fails the build)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: plugin/lcov.info
          slug: GetBusbar/busbar-store-sqlite
          fail_ci_if_error: false
