# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-sqlite-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:store plugin cdylib: the SQLite governance store packaged as a droppable busbar plugin exporting the store C ABI. Drop the built library into the plugins folder and set governance.store: sqlite."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib for the C ABI delivery; rlib so the unit tests / e2e test can exercise it as a normal crate too

[dependencies]
# busbar-store-sqlite is now a SAME-REPO sibling crate (this plugin brings 100% of what it needs — the
# real logic lives here, not in busbarAI). Only busbar-api/busbar-plugin-sdk still reach into busbarAI
# — INTERIM local path dependencies into a sibling checkout, since busbarAI isn't public yet; once it
# ships publicly these become git (pinned rev/tag) or crates.io dependencies instead.
busbar-api = { path = "../../busbarAI/crates/api" }
busbar-plugin-sdk = { path = "../../busbarAI/crates/plugin-sdk" }
busbar-store-sqlite = { path = "../store-sqlite" }
serde_json = "1"

[dev-dependencies]
# INTERIM local path dep into busbarAI, same rationale as above — dev-only. The end-to-end test loads
# the built cdylib over the real loader ABI seam, so it needs the real loader — never shipped in the
# plugin artifact itself.
busbar-plugin-loader = { path = "../../busbarAI/crates/plugin-loader" }
# Dev-only: the `busy_timeout_ms_is_actually_applied` unit test opens a second, independent
# connection to the SAME sqlite file to hold a lock and observe the plugin's configured busy_timeout
# behaviorally. `SqliteStore` doesn't expose its inner connection, so the test needs its own. Same
# version/feature as `busbar-store-sqlite`'s dependency so only one sqlite is ever linked in.
rusqlite = { version = "0.40.0", features = ["bundled"] }
