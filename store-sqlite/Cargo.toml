# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-sqlite"
version = "1.6.0"
publish.workspace = true   # a first-party plugin crate; shipped linked into busbar or as a signed tarball
edition.workspace = true
rust-version.workspace = true
description = "The SQLite backend for busbar's durable governance store: implements the primitive persistence contract on rusqlite (bundled)."
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# Native primitive persistence door; the sibling cdylib exports the same implementation.
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into it
# as `busbar_contract::abi::sdk`). Pinned by git rev to the busbar commit in `.busbar-ref`; a busbar
# build that links this crate `[patch]`es the busbar git source to its own tree, so ONE copy of the
# contract links.
busbar-contract = { workspace = true }
# `bundled` compiles SQLite from source so the plugin has no system libsqlite3 dependency at all.
rusqlite = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
# Native regression injects a commit failure to verify Unknown custody.
rusqlite = { workspace = true, features = ["hooks"] }

# Safe handle metadata for native migration coordination; no Linux dependency.
[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"
